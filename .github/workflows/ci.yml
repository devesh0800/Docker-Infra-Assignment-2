name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx fastapi sqlalchemy uvicorn prometheus-client python-json-logger
          
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          
      - name: Run Unit Tests
        run: |
          export DATABASE_URL=sqlite:///./test.db
          python -m pytest src/tests/test_main.py
          
  docker-build-verify:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t todo-api:test .
        
      - name: Verify Docker image starts
        run: |
          docker run -d --name test-api -p 3000:3000 -e DATABASE_URL=sqlite:///./data/test.db todo-api:test
          sleep 5
          curl -f http://localhost:3000/health
          docker stop test-api
